<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses — ExpenseAI</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <main class="app-main">
      <header class="app-header" id="app-header"></header>

      <div class="app-content">
        <!-- Filter and Search Toolbar -->
        <div class="filter-bar">
          <div class="filter-group">
            <div class="search-input-wrapper" style="max-width: 240px;">
              <i data-lucide="search" class="search-icon" style="width: 14px; height: 14px;"></i>
              <input type="text" id="filter-search" class="form-control" placeholder="Search merchant...">
            </div>

            <select id="filter-category" class="form-control" style="width: 170px;">
              <option value="All">All Categories</option>
              <option value="Travel">Travel</option>
              <option value="Meals & Entertainment">Meals & Entertainment</option>
              <option value="Office Supplies">Office Supplies</option>
              <option value="Software & Subscriptions">Software & Subscriptions</option>
              <option value="Accommodation">Accommodation</option>
              <option value="Transportation">Transportation</option>
              <option value="Utilities">Utilities</option>
              <option value="Marketing">Marketing</option>
              <option value="Equipment">Equipment</option>
              <option value="Other">Other</option>
            </select>

            <select id="filter-status" class="form-control" style="width: 150px;">
              <option value="All">All Statuses</option>
              <option value="submitted">Submitted</option>
              <option value="under_review">Under Review</option>
              <option value="approved">Approved</option>
              <option value="reimbursed">Reimbursed</option>
              <option value="rejected">Rejected</option>
            </select>

            <select id="filter-policy" class="form-control" style="width: 160px;">
              <option value="All">All Policy States</option>
              <option value="within_policy">Within Policy</option>
              <option value="requires_review">Requires Review</option>
              <option value="policy_violation">Policy Violation</option>
            </select>
          </div>

          <div class="flex gap-sm">
            <button class="btn btn-secondary btn-sm" onclick="resetFilters()">
              <i data-lucide="rotate-ccw"></i> Reset
            </button>
            <a href="add-expense.html" class="btn btn-primary btn-sm">
              <i data-lucide="plus"></i> New Expense
            </a>
          </div>
        </div>

        <!-- Expense Transactions Table -->
        <div class="card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Merchant / Vendor</th>
                  <th>Category</th>
                  <th>Payment</th>
                  <th>Policy Audit</th>
                  <th>Status</th>
                  <th style="text-align: right;">Amount (USD)</th>
                  <th style="text-align: center;">Actions</th>
                </tr>
              </thead>
              <tbody id="expenses-table-body">
                <tr>
                  <td colspan="8" style="text-align: center; padding: 40px; color: var(--text-muted);">
                    <div class="spinner" style="margin: 0 auto 10px;"></div>
                    Loading expense records...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Expense Details Modal Dialog -->
  <div class="modal-backdrop" id="expense-modal">
    <div class="modal-dialog" style="max-width: 680px;">
      <div class="modal-header">
        <div>
          <div class="card-title" id="modal-merchant">Expense Details</div>
          <div class="card-subtitle" id="modal-date">Transaction breakdown and policy compliance</div>
        </div>
        <button class="btn-icon" onclick="closeModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body" id="modal-body-content">
        <!-- Dynamic Content injected via JS -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/expenses.js"></script>
</body>
</html>
