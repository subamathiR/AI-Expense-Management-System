<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Expense — ExpenseAI</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">E</div>
        <div>
          <h3 style="font-size: 1.1rem;">ExpenseAI</h3>
          <p style="font-size: 0.75rem;" class="text-muted">Smart Expense Manager</p>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="./dashboard.html" class="nav-item">📊 Dashboard</a>
        <a href="./expenses.html" class="nav-item active">💳 Expenses</a>
        <a href="./receipt-scan.html" class="nav-item">📑 Receipt Scan</a>
        <a href="./reports.html" class="nav-item">📁 Reports</a>
        <a href="./mileage.html" class="nav-item">🚗 Mileage</a>
        <a href="./budget.html" class="nav-item">💰 Budgets</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar">JS</div>
          <div>
            <p style="font-size: 0.875rem; font-weight: 600;">John Smith</p>
            <p style="font-size: 0.75rem;" class="text-muted">Employee</p>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <header class="header">
        <h2>Create Expense Claim</h2>
        <a href="./expenses.html" class="btn btn-secondary" style="padding: 0.5rem 1rem;">Back to List</a>
      </header>

      <main class="content-body">
        <form class="card" action="./expenses.html" style="max-width: 700px;">
          <h3 style="margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border-color);">Claim Information</h3>

          <div class="form-group">
            <label for="title">Expense Title *</label>
            <input type="text" id="title" required placeholder="e.g. Client Dinner at Bistro">
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="amount">Amount *</label>
              <input type="number" step="0.01" id="amount" required placeholder="0.00">
            </div>
            <div class="form-group">
              <label for="currency">Currency</label>
              <select id="currency">
                <option value="INR">INR (₹)</option>
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="GBP">GBP (£)</option>
              </select>
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="category">Expense Category</label>
              <select id="category">
                <option value="Meals">Meals & Entertainment</option>
                <option value="Travel">Travel & Transportation</option>
                <option value="Accommodation">Accommodation / Hotel</option>
                <option value="Software">Software & Cloud Services</option>
                <option value="Office">Office Supplies</option>
              </select>
            </div>
            <div class="form-group">
              <label for="date">Expense Date *</label>
              <input type="date" id="date" required value="2026-08-23">
            </div>
          </div>

          <div class="form-group">
            <label for="vendor">Vendor / Merchant Name</label>
            <input type="text" id="vendor" placeholder="e.g. Starbucks / Delta Airlines">
          </div>

          <div class="form-group">
            <label for="description">Business Purpose & Description</label>
            <textarea id="description" rows="3" placeholder="Provide details regarding business justification..."></textarea>
          </div>

          <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Save & Submit Claim</button>
            <a href="./expenses.html" class="btn btn-secondary" style="flex: 1; text-align: center;">Cancel</a>
          </div>
        </form>
      </main>
    </div>
  </div>
</body>
</html>
