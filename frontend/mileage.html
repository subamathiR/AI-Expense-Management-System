<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mileage Tracking — ExpenseAI</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <main class="app-main">
      <header class="app-header" id="app-header"></header>

      <div class="app-content">
        <div class="grid-2">
          <!-- Mileage Log Form -->
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">
                  <i data-lucide="map-pin" style="color: var(--brand-primary);"></i>
                  Log Business Mileage Claim
                </div>
                <div class="card-subtitle">Calculate ground transit reimbursements at IRS standard rates</div>
              </div>
              <span class="accent-pill">$0.67 / Mile</span>
            </div>
            <div class="card-body">
              <form id="mileage-form">
                <div class="form-group">
                  <label class="form-label">Trip Date <span class="required">*</span></label>
                  <input type="date" id="trip-date" class="form-control" required>
                </div>

                <div class="grid-2">
                  <div class="form-group">
                    <label class="form-label">Origin / Starting Location <span class="required">*</span></label>
                    <input type="text" id="start-location" class="form-control" placeholder="e.g. Headquarters (New York, NY)" required>
                  </div>

                  <div class="form-group">
                    <label class="form-label">Destination Location <span class="required">*</span></label>
                    <input type="text" id="destination" class="form-control" placeholder="e.g. Client Campus (Jersey City, NJ)" required>
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Business Purpose <span class="required">*</span></label>
                  <input type="text" id="business-purpose" class="form-control" placeholder="e.g. Onsite enterprise client meeting & architecture review" required>
                </div>

                <div class="grid-2">
                  <div class="form-group">
                    <label class="form-label">Distance (Miles) <span class="required">*</span></label>
                    <input type="number" step="0.1" id="distance-miles" class="form-control" placeholder="e.g. 42.5" required oninput="calculateReimbursement()">
                  </div>

                  <div class="form-group">
                    <label class="form-label">Configured IRS Rate</label>
                    <input type="number" step="0.01" id="rate-per-mile" class="form-control" value="0.67" readonly>
                  </div>
                </div>

                <!-- Estimated Calculation Highlight Card -->
                <div style="background: var(--surface-card-subtle); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-medium); margin-bottom: var(--space-md);">
                  <div class="flex justify-between items-center">
                    <div>
                      <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Estimated Reimbursement</div>
                      <div style="font-family: var(--font-heading); font-size: 24px; font-weight: 800; color: var(--brand-primary);" id="estimated-payout">
                        $0.00
                      </div>
                    </div>
                    <span class="badge badge-within-policy">Calculated</span>
                  </div>
                </div>

                <div class="form-group">
                  <label class="switch-label">
                    <span class="switch">
                      <input type="checkbox" id="auto-expense-check" checked>
                      <span class="switch-slider"></span>
                    </span>
                    <span>Automatically append to active Expense Ledger under 'Transportation'</span>
                  </label>
                </div>

                <button type="submit" class="btn btn-primary w-full" id="log-trip-btn">
                  <i data-lucide="check-circle-2"></i> Log Mileage Claim
                </button>
              </form>
            </div>
          </div>

          <!-- Trip History & Rate Information -->
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">Recent Mileage Trips</div>
                <div class="card-subtitle">Audited transit distances and ledger synchronization</div>
              </div>
            </div>
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Route</th>
                    <th>Miles</th>
                    <th style="text-align: right;">Payout</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="mileage-tbody">
                  <tr>
                    <td colspan="5" style="text-align: center; padding: 25px; color: var(--text-muted);">
                      Loading logged trips...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mileage.js"></script>
</body>
</html>
