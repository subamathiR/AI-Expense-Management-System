<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Financial Assistant — ExpenseAI</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <main class="app-main">
      <header class="app-header" id="app-header"></header>

      <div class="app-content">
        <!-- Pre-built Quick Prompt Pills -->
        <div style="margin-bottom: var(--space-md);">
          <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">
            Suggested Financial Queries:
          </div>
          <div class="flex gap-xs" style="flex-wrap: wrap;">
            <button class="chat-prompt-pill" onclick="sendPrompt('How much did I spend this month?')">
              💸 How much did I spend this month?
            </button>
            <button class="chat-prompt-pill" onclick="sendPrompt('Which category has the highest expenses?')">
              📊 Top spending category
            </button>
            <button class="chat-prompt-pill" onclick="sendPrompt('Show expenses exceeding policy limits')">
              ⚠️ Policy violation summary
            </button>
            <button class="chat-prompt-pill" onclick="sendPrompt('How much budget remains?')">
              📉 Remaining company budget
            </button>
            <button class="chat-prompt-pill" onclick="sendPrompt('Which reports are waiting for approval?')">
              ⏳ Pending approval queue
            </button>
          </div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container">
          <div class="chat-messages" id="chat-messages-box">
            <!-- AI Welcome Bubble -->
            <div class="chat-bubble chat-bubble-ai">
              <div style="font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; color: var(--brand-primary);">
                <i data-lucide="bot" style="width: 16px; height: 16px;"></i> ExpenseAI Financial Assistant
              </div>
              <div>
                Hello! I am connected to your authenticated live expense ledger, corporate policies, and department budgets. You can ask me natural language questions about spending trajectories, policy flags, budget headroom, or reimbursement statuses.
              </div>
            </div>
          </div>

          <!-- Input Bar -->
          <form id="chat-form" class="chat-input-bar">
            <input type="text" id="chat-input" class="form-control" placeholder="Ask a financial question or query (e.g. 'How much did I spend this month?')..." autocomplete="off" required>
            <button type="submit" class="btn btn-primary" id="chat-send-btn">
              <i data-lucide="send"></i>
              <span>Send</span>
            </button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/assistant.js"></script>
</body>
</html>
